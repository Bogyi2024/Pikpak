name: PikPak / Direct Link → HuggingFace Transfer

on:
  workflow_dispatch:
    inputs:

      # ── Source ───────────────────────────────────────────────────────────────
      source_type:
        description: "Download source"
        required: true
        default: "pikpak"
        type: choice
        options:
          - pikpak
          - direct_links

      # ── PikPak (ignored when source_type = direct_links) ────────────────────
      email:
        description: "PikPak Email  ▸ pikpak only"
        required: false
      password:
        description: "PikPak Password  ▸ pikpak only"
        required: false
        type: string
      delete_after_collect:
        description: "Delete files from PikPak after collecting links?  ▸ pikpak only"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      # ── Direct links (ignored when source_type = pikpak) ────────────────────
      direct_links:
        description: |
          Direct download URLs  ▸ direct_links only
          • Multiple URLs supported — one per line
          • Optional custom filename / subpath after the URL:
              https://example.com/model.bin
              https://example.com/weights.pt   my-weights.pt
              https://example.com/data.zip     subdir/data.zip
        required: false

      # ── Downloader ───────────────────────────────────────────────────────────
      downloader:
        description: "Downloader  (auto → aria2c for pikpak, wget for direct_links)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - aria2c
          - wget
          - curl

      # ── HuggingFace ──────────────────────────────────────────────────────────
      hf_token:
        description: "HuggingFace Token"
        required: true
        type: string
      repo_id:
        description: "HuggingFace Repo ID (e.g. username/reponame)"
        required: true
      repo_type:
        description: "HuggingFace Repo Type"
        required: true
        type: choice
        options:
          - model
          - dataset
          - space

jobs:
  transfer:
    runs-on: ubuntu-latest

    steps:
      - name: ⚙️ Checkout repo
        uses: actions/checkout@v4

      # ── Early validation: catch missing required fields per source_type ──────
      - name: ✅ Validate inputs
        env:
          SOURCE_TYPE:  ${{ github.event.inputs.source_type }}
          EMAIL:        ${{ github.event.inputs.email }}
          PASSWORD:     ${{ github.event.inputs.password }}
          DIRECT_LINKS: ${{ github.event.inputs.direct_links }}
        run: |
          python - << 'EOF'
          import os, sys

          source = os.environ.get("SOURCE_TYPE", "")
          errors = []

          if source == "pikpak":
              if not os.environ.get("EMAIL", "").strip():
                  errors.append("❌  'email' is required when source_type = pikpak")
              if not os.environ.get("PASSWORD", "").strip():
                  errors.append("❌  'password' is required when source_type = pikpak")

          elif source == "direct_links":
              raw  = os.environ.get("DIRECT_LINKS", "").strip()
              urls = [l.strip() for l in raw.splitlines()
                      if l.strip() and not l.strip().startswith("#")]
              if not urls:
                  errors.append("❌  'direct_links' must contain at least one URL "
                                "when source_type = direct_links")
              else:
                  print(f"✅  {len(urls)} URL(s) detected in direct_links")

          else:
              errors.append(f"❌  Unknown source_type: {source!r}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          print(f"✅  Validation passed  (source: {source})")
          EOF

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          pip install pikpakapi huggingface_hub
          sudo apt-get install -y aria2 wget curl

      - name: 📁 Create directories
        run: |
          mkdir -p /tmp/pikpak/
          mkdir -p /tmp/meta/

      # ═══════════════════════════════════════════════════════════════════════
      #  PHASE 1-A  ·  PikPak — crawl & collect CDN download URLs
      # ═══════════════════════════════════════════════════════════════════════
      - name: 🔍 [PikPak] Collect all download links (+ optional delete)
        if: ${{ github.event.inputs.source_type == 'pikpak' }}
        env:
          PIKPAK_EMAIL:         ${{ github.event.inputs.email }}
          PIKPAK_PASSWORD:      ${{ github.event.inputs.password }}
          DELETE_AFTER_COLLECT: ${{ github.event.inputs.delete_after_collect }}
        run: |
          cat << 'EOF' > /tmp/collect_links.py
          import os, json, asyncio
          from pikpakapi import PikPakApi

          EMAIL     = os.environ["PIKPAK_EMAIL"]
          PASSWORD  = os.environ["PIKPAK_PASSWORD"]
          DO_DELETE = os.environ.get("DELETE_AFTER_COLLECT", "true").lower() == "true"
          MANIFEST  = "/tmp/meta/manifest.json"

          async def collect_all():
              client = PikPakApi(username=EMAIL, password=PASSWORD)
              await client.login()
              print("✅ Logged in — crawling file tree...")
              print(f"{'🗑️  Delete-after-collect ENABLED' if DO_DELETE else 'ℹ️  Delete-after-collect DISABLED'}\n")

              entries = []

              async def crawl(folder_id, folder_path):
                  result = await client.file_list(parent_id=folder_id)
                  items  = result["files"]

                  if not items:
                      print(f"📭 Empty folder: {folder_path or 'root'}")
                      return

                  for item in items:
                      name, kind, item_id = item["name"], item["kind"], item["id"]

                      if kind.endswith("folder"):
                          new_path = os.path.join(folder_path, name)
                          print(f"📁 Entering: {new_path}")
                          await crawl(item_id, new_path)
                          if DO_DELETE:
                              try:
                                  await client.delete_to_trash([item_id])
                                  print(f"🗑️  Trashed folder: {new_path}")
                              except Exception as e:
                                  print(f"⚠️  Could not trash folder {new_path}: {e}")
                      else:
                          save_path = os.path.join("/tmp/pikpak/", folder_path)
                          try:
                              res = await client.get_download_url(item_id)
                              url = res["web_content_link"]
                              entries.append({"save_path": save_path, "name": name, "url": url})
                              print(f"🔗 [{len(entries):>3}] Collected: {os.path.join(folder_path, name)}")
                              if DO_DELETE:
                                  try:
                                      await client.delete_to_trash([item_id])
                                      print(f"🗑️  Trashed: {name}")
                                  except Exception as e:
                                      print(f"⚠️  Could not trash {name}: {e}")
                          except Exception as e:
                              print(f"❌ Could not get URL for {name} — {e}")

              await crawl(None, "")
              with open(MANIFEST, "w") as f:
                  json.dump(entries, f, indent=2)
              print(f"\n✅ Manifest saved — {len(entries)} file(s) queued.")

          asyncio.run(collect_all())
          EOF
          python /tmp/collect_links.py

      # ═══════════════════════════════════════════════════════════════════════
      #  PHASE 1-B  ·  Direct links — build manifest from user input
      # ═══════════════════════════════════════════════════════════════════════
      - name: 🔗 [Direct] Parse direct download links
        if: ${{ github.event.inputs.source_type == 'direct_links' }}
        env:
          DIRECT_LINKS: ${{ github.event.inputs.direct_links }}
        run: |
          cat << 'EOF' > /tmp/parse_direct.py
          import os, json
          from urllib.parse import urlparse, unquote

          RAW      = os.environ.get("DIRECT_LINKS", "")
          MANIFEST = "/tmp/meta/manifest.json"
          SAVE_DIR = "/tmp/pikpak/"

          entries = []

          for raw_line in RAW.splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#"):
                  continue

              # Formats accepted:
              #   <url>                  → filename derived from URL path
              #   <url>  <name>          → flat custom filename
              #   <url>  <subdir/name>   → placed in subdirectory on HF
              parts = line.split(None, 1)
              url   = parts[0]

              if len(parts) == 2:
                  custom    = parts[1].strip()
                  name      = os.path.basename(custom)
                  subdir    = os.path.dirname(custom)
                  save_path = os.path.join(SAVE_DIR, subdir) if subdir else SAVE_DIR
              else:
                  parsed    = urlparse(url)
                  # FIX: Decode the URL path to convert %E4... back into normal text
                  decoded_path = unquote(parsed.path)
                  name      = os.path.basename(decoded_path) or f"file_{len(entries)+1}"
                  save_path = SAVE_DIR

              entries.append({"save_path": save_path, "name": name, "url": url})
              display = os.path.relpath(os.path.join(save_path, name), SAVE_DIR)
              print(f"🔗 [{len(entries):>3}] {display}")
              print(f"         ← {url[:80]}{'...' if len(url) > 80 else ''}")

          with open(MANIFEST, "w") as f:
              json.dump(entries, f, indent=2)

          print(f"\n✅ Manifest saved — {len(entries)} file(s) queued.")
          EOF
          python /tmp/parse_direct.py

      # ═══════════════════════════════════════════════════════════════════════
      #  PHASE 1-C  ·  Show full manifest table
      # ═══════════════════════════════════════════════════════════════════════
      - name: 📋 Show manifest
        run: |
          python - << 'EOF'
          import json, os
          with open("/tmp/meta/manifest.json") as f:
              entries = json.load(f)
          print(f"{'#':>4}  {'HF path':<45}  URL")
          print("-" * 105)
          for i, e in enumerate(entries, 1):
              rel     = os.path.relpath(os.path.join(e["save_path"], e["name"]), "/tmp/pikpak/")
              preview = e["url"][:55] + "..." if len(e["url"]) > 55 else e["url"]
              print(f"{i:>4}  {rel:<45}  {preview}")
          print(f"\nTotal: {len(entries)} file(s) queued.")
          EOF

      # ═══════════════════════════════════════════════════════════════════════
      #  PHASE 2  ·  Download all files
      # ═══════════════════════════════════════════════════════════════════════
      - name: ⬇️ Download files
        env:
          SOURCE_TYPE: ${{ github.event.inputs.source_type }}
          DOWNLOADER:  ${{ github.event.inputs.downloader }}
        run: |
          cat << 'EOF' > /tmp/download_files.py
          import os, json, subprocess, shutil, sys

          MANIFEST    = "/tmp/meta/manifest.json"
          SOURCE_TYPE = os.environ.get("SOURCE_TYPE", "pikpak")
          DL_CHOICE   = os.environ.get("DOWNLOADER", "auto").lower()

          # ── Resolve "auto" ────────────────────────────────────────────────
          if DL_CHOICE == "auto":
              DL_CHOICE = "aria2c" if SOURCE_TYPE == "pikpak" else "wget"
              print(f"ℹ️  Auto-selected downloader: {DL_CHOICE!r}  (source: {SOURCE_TYPE})")

          if not shutil.which(DL_CHOICE):
              print(f"❌ Downloader '{DL_CHOICE}' not found in PATH.")
              sys.exit(1)

          print(f"🔧 Downloader: {DL_CHOICE}\n")

          # ── Command builders ──────────────────────────────────────────────
          def cmd_aria2c(url, save_path, name):
              return [
                  "aria2c",
                  f"--dir={save_path}",
                  f"--out={name}",
                  "--max-connection-per-server=16",
                  "--split=16",
                  "--min-split-size=1M",
                  "--file-allocation=none",
                  "--user-agent=Mozilla/5.0",
                  "--header=Referer: https://mypikpak.com",
                  "--console-log-level=notice",
                  "--summary-interval=5",
                  url,
              ]

          def cmd_wget(url, save_path, name):
              return [
                  "wget",
                  "--no-verbose",
                  "--show-progress",
                  "--progress=bar:force",
                  "--user-agent=Mozilla/5.0",
                  "-O", os.path.join(save_path, name),
                  url,
              ]

          def cmd_curl(url, save_path, name):
              return [
                  "curl", "-L",
                  "--progress-bar",
                  "-A", "Mozilla/5.0",
                  "-o", os.path.join(save_path, name),
                  url,
              ]

          BUILDERS = {"aria2c": cmd_aria2c, "wget": cmd_wget, "curl": cmd_curl}
          build_cmd = BUILDERS.get(DL_CHOICE)
          if not build_cmd:
              print(f"❌ Unknown downloader: {DL_CHOICE!r}.  Choose: aria2c, wget, curl")
              sys.exit(1)

          # ── Download loop ─────────────────────────────────────────────────
          with open(MANIFEST) as f:
              entries = json.load(f)

          total, success, failed = len(entries), 0, []

          for idx, entry in enumerate(entries, 1):
              save_path, name, url = entry["save_path"], entry["name"], entry["url"]
              os.makedirs(save_path, exist_ok=True)

              print(f"\n[{idx}/{total}] ⬇️  {name}")
              print(f"         🔗 {url[:80]}{'...' if len(url) > 80 else ''}")

              ret = subprocess.run(build_cmd(url, save_path, name)).returncode

              if ret == 0:
                  dest = os.path.join(save_path, name)
                  size = os.path.getsize(dest) if os.path.exists(dest) else 0
                  print(f"✅ Done: {name}  ({size / 1024 / 1024:.2f} MB)")
                  success += 1
              else:
                  print(f"❌ Failed: {name}  (exit {ret})")
                  failed.append(name)

          print(f"\n{'='*55}")
          print(f"Downloader : {DL_CHOICE}")
          print(f"✅ Success  : {success}/{total}")
          if failed:
              print(f"❌ Failed   : {len(failed)}")
              for n in failed:
                  print(f"   • {n}")
              sys.exit(1)
          EOF
          python /tmp/download_files.py

      - name: 📋 List downloaded files
        run: find /tmp/pikpak/ -type f -exec ls -lh {} \;

      # ═══════════════════════════════════════════════════════════════════════
      #  PHASE 3  ·  Upload to HuggingFace
      # ═══════════════════════════════════════════════════════════════════════
      - name: 🚀 Upload to HuggingFace
        env:
          HF_TOKEN:  ${{ github.event.inputs.hf_token }}
          REPO_ID:   ${{ github.event.inputs.repo_id }}
          REPO_TYPE: ${{ github.event.inputs.repo_type }}
        run: |
          cat << 'EOF' > /tmp/hf_upload.py
          import os
          from huggingface_hub import HfApi

          TOKEN     = os.environ["HF_TOKEN"]
          REPO_ID   = os.environ["REPO_ID"]
          REPO_TYPE = os.environ["REPO_TYPE"]

          api = HfApi()

          try:
              api.create_repo(repo_id=REPO_ID, repo_type=REPO_TYPE, token=TOKEN, exist_ok=True)
              print(f"✅ Repo ready: {REPO_ID}")
          except Exception as e:
              print(f"⚠️  Repo check: {e}")

          print(f"🚀 Uploading to https://huggingface.co/{REPO_ID}")
          api.upload_folder(
              folder_path="/tmp/pikpak/",
              repo_id=REPO_ID,
              repo_type=REPO_TYPE,
              token=TOKEN,
          )
          print("✅ Upload complete!")
          EOF
          python /tmp/hf_upload.py
